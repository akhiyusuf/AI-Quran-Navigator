      /* GLOBAL OVERRIDES & STYLES */

      /* Custom Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--muted);
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--accent);
        border-radius: 5px;
        border: 2px solid var(--muted);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--primary);
      }

      /* Tailwind Typography Overrides for Theme Compatibility */
      .prose {
        --tw-prose-body: var(--card-foreground);
        --tw-prose-headings: var(--card-foreground);
        --tw-prose-lead: var(--card-foreground);
        --tw-prose-links: var(--primary);
        --tw-prose-bold: var(--card-foreground);
        --tw-prose-counters: var(--muted-foreground);
        --tw-prose-bullets: var(--muted-foreground);
        --tw-prose-hr: var(--border);
        --tw-prose-quotes: var(--card-foreground);
        --tw-prose-quote-borders: var(--border);
        --tw-prose-captions: var(--muted-foreground);
        --tw-prose-code: var(--primary);
        --tw-prose-pre-code: var(--primary-soft-foreground);
        --tw-prose-pre-bg: var(--primary-soft);
        --tw-prose-th-borders: var(--border);
        --tw-prose-td-borders: var(--border);
        /* Invert vars are set to the same to override default dark mode behavior */
        --tw-prose-invert-body: var(--card-foreground);
        --tw-prose-invert-headings: var(--card-foreground);
        --tw-prose-invert-lead: var(--card-foreground);
        --tw-prose-invert-links: var(--primary);
        --tw-prose-invert-bold: var(--card-foreground);
        --tw-prose-invert-counters: var(--muted-foreground);
        --tw-prose-invert-bullets: var(--muted-foreground);
        --tw-prose-invert-hr: var(--border);
        --tw-prose-invert-quotes: var(--card-foreground);
        --tw-prose-invert-quote-borders: var(--border);
        --tw-prose-invert-captions: var(--muted-foreground);
        --tw-prose-invert-code: var(--primary);
        --tw-prose-invert-pre-code: var(--primary-soft-foreground);
        --tw-prose-invert-pre-bg: var(--primary-soft);
        --tw-prose-invert-th-borders: var(--border);
        --tw-prose-invert-td-borders: var(--border);
      }

      /* Fix for prose elements not inheriting theme colors, likely due to CDN script specificity */
      strong, b {
        font-weight: 600; /* Global bold style */
      }

      .prose p,
      .prose blockquote,
      .prose li,
      .prose strong, .prose b {
        color: var(--card-foreground);

      .prose code {
        color: var(--primary);
      }
